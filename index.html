<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コーハツアルカナハート3LMSSX 通算戦績</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-dark: #0b1220;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-strong: #0284c7;
    --win: #4ade80;
    --lose: #f87171;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; line-height:1.5; }
  .container { max-width: 1200px; margin: 0 auto; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
  h1 { font-size:1.45rem; margin:0; }
  h2 { font-size:1.1rem; margin:20px 0 10px; color:#7dd3fc; }
  .scope-box { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--accent); border-radius:8px; padding:6px 12px; }
  .scope-box label { font-size:0.85rem; color:var(--muted); white-space:nowrap; }
  .scope-box select { border:none; background:transparent; color:#fff; font-weight:600; font-size:0.92rem; padding:2px 4px; outline:none; cursor:pointer; }
  .scope-box select option { background:var(--panel-dark); color:var(--text); }
  .summary { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0 18px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:11px 16px; min-width:140px; }
  .card .lbl { font-size:0.8rem; color:var(--muted); }
  .card strong { color:var(--accent); font-size:1.18rem; display:block; margin-top:2px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 18px; }
  button, select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 12px; font-size:0.88rem; }
  button { cursor:pointer; transition: background 0.15s, border-color 0.15s; }
  button:hover { border-color:var(--accent); }
  button.active { background:var(--accent-strong); border-color:var(--accent); color:#fff; font-weight:600; }
  select { border-color:var(--accent); }
  .sub-controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .chip-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { padding:5px 10px; border-radius:999px; font-size:0.83rem; background:var(--panel); border:1px solid var(--border); color:var(--text); cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  .chip.active { background:var(--accent-strong); border-color:var(--accent); color:#fff; font-weight:600; }
  .chip small { opacity:0.8; margin-left:4px; }
  .char-card, .day-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:14px; overflow:hidden; }
  .char-header, .day-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; background:var(--panel-dark); padding:11px 15px; border-bottom:1px solid var(--border); }
  .char-header h3, .day-header h3 { margin:0; font-size:1.02rem; color:#f8fafc; }
  .char-header small { color:var(--muted); font-weight:400; margin-left:6px; font-size:0.8rem; }
  .char-total { font-size:0.88rem; color:#cbd5e1; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th, td { padding:9px 11px; border-bottom:1px solid var(--border); text-align:left; font-size:0.9rem; }
  th { background:var(--panel-dark); color:var(--muted); font-size:0.8rem; white-space:nowrap; }
  th.num, td.num { text-align:right; white-space:nowrap; }
  .win { color:var(--win); font-weight:600; }
  .lose { color:var(--lose); font-weight:600; }
  .muted { color:var(--muted); }
  .bar { display:inline-block; width:58px; height:8px; background:#334155; border-radius:4px; overflow:hidden; vertical-align:middle; margin-left:6px; }
  .bar span { display:block; height:100%; background:var(--accent); }
  .bar span.hi { background:var(--win); }
  .bar span.lo { background:var(--lose); }
  .panel { display:none; }
  .panel.active { display:block; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* Expandable matchup rows */
  tr.mu-row { cursor:pointer; transition: background 0.12s; }
  tr.mu-row:hover { background: rgba(56, 189, 248, 0.1); }
  tr.mu-detail { display:none; background:#142033; }
  tr.mu-detail.open { display:table-row; }
  tr.mu-detail > td { padding:10px 14px 14px; border-bottom:1px solid var(--border); }
  .detail-inner { background:var(--panel-dark); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .detail-title { padding:7px 12px; font-size:0.82rem; color:#7dd3fc; border-bottom:1px solid var(--border); }
  .detail-inner table th, .detail-inner table td { padding:6px 10px; font-size:0.84rem; }
  .caret { display:inline-block; width:14px; color:var(--accent); font-size:0.75rem; transition:transform 0.15s; }
  tr.mu-row.open .caret { transform: rotate(90deg); }
  .badge { display:inline-block; font-size:0.74rem; padding:2px 7px; border-radius:999px; background:#0b1220; border:1px solid var(--border); color:#cbd5e1; }
  .badge-merged { background:rgba(56,189,248,0.18); border-color:var(--accent); color:#7dd3fc; }

  /* Matrix heatmap */
  .matrix-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  table.matrix { width:max-content; min-width:100%; }
  table.matrix th, table.matrix td { text-align:center; padding:7px 8px; border-right:1px solid #263349; font-size:0.8rem; min-width:68px; }
  table.matrix th.sticky, table.matrix td.sticky { position:sticky; left:0; z-index:2; background:var(--panel-dark); text-align:left; min-width:108px; font-weight:600; border-right:2px solid var(--border); }
  table.matrix td.cell-click { cursor:pointer; transition:outline 0.1s, filter 0.1s; }
  table.matrix td.cell-click:hover { filter:brightness(1.2); outline:1px solid #fff; }
  table.matrix td.cell-selected { outline:2px solid var(--accent); }
  .cell-rate { font-weight:700; display:block; font-size:0.84rem; }
  .cell-wl { font-size:0.72rem; opacity:0.88; }
  .matrix-detail-box { margin-top:14px; background:var(--panel); border:1px solid var(--accent); border-radius:10px; overflow:hidden; }
  .matrix-detail-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 14px; background:var(--panel-dark); border-bottom:1px solid var(--border); }
  .day-body { padding:12px 15px; }
  .day-videos { margin:0 0 10px; padding-left:18px; font-size:0.88rem; }
  .day-videos li { margin-bottom:4px; }
  .hint { font-size:0.82rem; color:var(--muted); margin:0 0 10px; }

  /* Mini-calendar scope popover */
  .cal-anchor { position:relative; }
  .cal-trigger { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--accent); border-radius:8px; padding:7px 13px; color:#fff; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .cal-trigger:hover { background:#24344d; }
  .cal-trigger .cal-arrow { color:var(--accent); font-size:0.75rem; margin-left:2px; }
  .cal-popover { display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:50; width:328px; max-width:calc(100vw - 32px); background:var(--panel); border:1px solid var(--accent); border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,0.55); padding:12px; }
  .cal-popover.open { display:block; }
  .cal-quick { display:flex; gap:6px; margin-bottom:10px; }
  .cal-quick button { flex:1; padding:6px 8px; font-size:0.8rem; text-align:center; border-radius:7px; }
  .cal-nav { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px; }
  .cal-nav button { padding:4px 10px; font-size:0.85rem; }
  .cal-month-title { font-weight:700; font-size:0.95rem; color:#f8fafc; }
  .cal-month-jump { font-size:0.82rem; padding:4px 8px; flex:1; text-align:center; background:var(--panel-dark); border:1px solid var(--border); border-radius:6px; color:#f8fafc; font-weight:600; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .cal-dow { text-align:center; font-size:0.74rem; color:var(--muted); padding:3px 0; font-weight:600; }
  .cal-dow.sun { color:#fca5a5; }
  .cal-dow.sat { color:#93c5fd; }
  .cal-day { min-height:42px; border-radius:7px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:0.82rem; color:#475569; background:rgba(11,18,32,0.45); border:1px solid transparent; padding:2px; }
  .cal-day.empty { background:transparent; }
  .cal-day.has-data { color:#f8fafc; background:rgba(56,189,248,0.14); border-color:rgba(56,189,248,0.55); cursor:pointer; font-weight:600; }
  .cal-day.has-data:hover { background:rgba(56,189,248,0.32); border-color:var(--accent); }
  .cal-day.selected { background:var(--accent-strong) !important; border-color:#7dd3fc !important; color:#fff !important; }
  .cal-day .cnt { font-size:0.65rem; color:#7dd3fc; line-height:1.1; margin-top:1px; }
  .cal-day.selected .cnt { color:#e0f2fe; }
  .cal-day .multi-dot { width:5px; height:5px; border-radius:50%; background:#fde047; display:inline-block; margin-left:2px; vertical-align:middle; }
  .cal-foot { display:flex; justify-content:space-between; align-items:center; margin-top:9px; padding-top:8px; border-top:1px solid var(--border); font-size:0.75rem; color:var(--muted); }
  @media (max-width: 520px) {
    .cal-popover { right:auto; left:0; }
  }
</style>
</head>

let currentScope = 'ALL';
let currentTab = 'grouped';
let matchupMode = 'list'; // 'list' or 'matrix'
let selectedMuChar = '';
let selectedMuOwnArcana = '';
let selectedMatrixPair = null; // [charA, charB]
let calYear = 2026;
let calMonth = 11; // 1..12

const DATES_BY_KEY = Object.fromEntries(APP.dates.map(d => [d.date, d]));
const MONTHS_BY_YM = Object.fromEntries((APP.months || []).map(m => [m.month, m]));

function initCalendarMonth() {
  const firstDated = APP.dates.find(d => /^\d{4}-\d{2}-\d{2}$/.test(d.date));
  if (firstDated) {
    const [y, m] = firstDated.date.split('-').map(Number);
    calYear = y;
    calMonth = m;
  } else {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth() + 1;
  }
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function rateBar(rate) {
  const cls = rate >= 55 ? 'hi' : (rate <= 45 ? 'lo' : '');
  return `${rate.toFixed(1)}% <span class="bar"><span class="${cls}" style="width:${rate.toFixed(1)}%"></span></span>`;
}

function getScope() {
  return APP.scopes[currentScope] || APP.scopes.ALL;
}

function formatScopeLabel() {
  const all = APP.scopes.ALL;
  if (currentScope === 'ALL') {
    return `全期間通算（${all.total_dates}日・${all.total_matches}試合）`;
  }
  if (currentScope.startsWith('MONTH:')) {
    const ym = currentScope.slice(6);
    const m = MONTHS_BY_YM[ym];
    return m ? `${m.label} 合計（${m.total_dates}日・${m.total_matches}試合）` : ym;
  }
  const d = DATES_BY_KEY[currentScope];
  if (d) {
    const merged = d.total_videos > 1 ? `・${d.total_videos}動画合算` : '';
    return `${d.label}（${d.total_matches}試合${merged}）`;
  }
  return currentScope;
}

function updateScopeTrigger() {
  document.getElementById('calTriggerLabel').textContent = formatScopeLabel();
}

function toggleCalendar(ev) {
  if (ev) ev.stopPropagation();
  const pop = document.getElementById('calPopover');
  const willOpen = !pop.classList.contains('open');
  if (willOpen) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(currentScope)) {
      const [y, m] = currentScope.split('-').map(Number);
      calYear = y; calMonth = m;
    } else if (currentScope.startsWith('MONTH:')) {
      const [y, m] = currentScope.slice(6).split('-').map(Number);
      calYear = y; calMonth = m;
    }
    renderCalendar();
  }
  pop.classList.toggle('open', willOpen);
}

function closeCalendar() {
  const pop = document.getElementById('calPopover');
  if (pop) pop.classList.remove('open');
}

function shiftCalendarMonth(delta) {
  calMonth += delta;
  if (calMonth < 1) { calMonth = 12; calYear -= 1; }
  if (calMonth > 12) { calMonth = 1; calYear += 1; }
  renderCalendar();
}

function jumpCalendarMonth(ym) {
  if (!ym) return;
  const [y, m] = ym.split('-').map(Number);
  calYear = y; calMonth = m;
  renderCalendar();
}

function selectScope(scopeKey) {
  currentScope = scopeKey;
  selectedMatrixPair = null;
  updateScopeTrigger();
  updateCharFilterOptions();
  renderSummaryCards();
  renderCurrentTab();
  closeCalendar();
}

function renderCalendar() {
  const ym = `${calYear}-${String(calMonth).padStart(2, '0')}`;
  const monthMeta = MONTHS_BY_YM[ym];
  const monthScopeKey = `MONTH:${ym}`;
  const all = APP.scopes.ALL;

  // Quick month jump options (include currently displayed month even if 0 events)
  const monthOptsList = [...(APP.months || [])];
  if (!monthOptsList.some(m => m.month === ym)) {
    monthOptsList.push({ month: ym, label: `${calYear}年${calMonth}月`, total_dates: 0, total_matches: 0 });
    monthOptsList.sort((a, b) => b.month.localeCompare(a.month));
  }
  let monthOptsHtml = '';
  for (const m of monthOptsList) {
    const sel = m.month === ym ? ' selected' : '';
    const extra = m.total_matches > 0 ? `（${m.total_dates}日・${m.total_matches}戦）` : '（開催なし）';
    monthOptsHtml += `<option value="${esc(m.month)}"${sel}>${esc(m.label)}${extra}</option>`;
  }

  const firstDow = new Date(calYear, calMonth - 1, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();

  let grid = `<div class="cal-dow sun">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow sat">土</div>`;
  for (let i = 0; i < firstDow; i++) {
    grid += '<div class="cal-day empty"></div>';
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${ym}-${String(day).padStart(2, '0')}`;
    const meta = DATES_BY_KEY[iso];
    if (meta) {
      const isSel = currentScope === iso;
      const multiDot = meta.total_videos > 1 ? '<span class="multi-dot" title="複数動画合算"></span>' : '';
      const tip = `${iso}: ${meta.total_matches}試合 (${meta.titles.join(' / ')})`;
      grid += `<button type="button" class="cal-day has-data ${isSel ? 'selected' : ''}" title="${esc(tip)}" onclick="selectScope('${esc(iso)}')">
        <span>${day}${multiDot}</span>
        <span class="cnt">${meta.total_matches}戦</span>
      </button>`;
    } else {
      grid += `<div class="cal-day"><span>${day}</span></div>`;
    }
  }

  const monthBtn = monthMeta
    ? `<button type="button" class="${currentScope === monthScopeKey ? 'active' : ''}" onclick="selectScope('${esc(monthScopeKey)}')">${calMonth}月全体（${monthMeta.total_matches}戦）</button>`
    : `<button type="button" disabled style="opacity:0.45;cursor:not-allowed">${calMonth}月（データなし）</button>`;

  const unknownMeta = DATES_BY_KEY['unknown'];
  const unknownRow = unknownMeta
    ? `<div style="margin-top:8px"><button type="button" style="width:100%;font-size:0.78rem;padding:5px" class="${currentScope === 'unknown' ? 'active' : ''}" onclick="selectScope('unknown')">日付不明（${unknownMeta.total_matches}試合）</button></div>`
    : '';

  document.getElementById('calPopover').innerHTML = `
    <div class="cal-quick">
      <button type="button" class="${currentScope === 'ALL' ? 'active' : ''}" onclick="selectScope('ALL')">全期間通算（${all.total_matches}戦）</button>
      ${monthBtn}
    </div>
    <div class="cal-nav">
      <button type="button" onclick="shiftCalendarMonth(-1)" title="前の月">◀</button>
      <select class="cal-month-jump" onchange="jumpCalendarMonth(this.value)">${monthOptsHtml}</select>
      <button type="button" onclick="shiftCalendarMonth(1)" title="次の月">▶</button>
    </div>
    <div class="cal-grid">${grid}</div>
    ${unknownRow}
    <div class="cal-foot">
      <span>青枠＝対戦会あり / <span class="multi-dot"></span>＝同日複数動画合算</span>
    </div>
  `;
}

document.addEventListener('click', (e) => {
  const anchor = document.getElementById('calAnchor');
  if (anchor && !anchor.contains(e.target)) closeCalendar();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCalendar();
});

function updateCharFilterOptions() {
  const scope = getScope();
  const sel = document.getElementById('charFilter');
  const prev = sel.value;
  let opts = '<option value="">すべてのキャラクター</option>';
  for (const c of scope.by_character) {
    opts += `<option value="${esc(c.char_key)}">${esc(c.char_name)} (${c.total.matches}試合)</option>`;
  }
  sel.innerHTML = opts;
  if (scope.by_character.some(c => c.char_key === prev)) {
    sel.value = prev;
  } else {
    sel.value = '';
  }
}

function renderSummaryCards() {
  const s = getScope();
  let cards = '';
  if (currentScope === 'ALL') {
    cards += `<div class="card"><span class="lbl">集計開催日数</span><strong>${s.total_dates}日</strong></div>`;
  } else if (currentScope.startsWith('MONTH:')) {
    const m = MONTHS_BY_YM[currentScope.slice(6)];
    cards += `<div class="card"><span class="lbl">選択中の月</span><strong>${esc(m ? m.label : currentScope.slice(6))}（${s.total_dates}日）</strong></div>`;
  } else {
    const dMeta = DATES_BY_KEY[currentScope];
    cards += `<div class="card"><span class="lbl">選択中の開催日</span><strong>${esc(dMeta ? dMeta.label : currentScope)}</strong></div>`;
  }
  cards += `<div class="card"><span class="lbl">集計動画数</span><strong>${s.total_videos}本</strong></div>`;
  cards += `<div class="card"><span class="lbl">総試合数</span><strong>${s.total_matches}試合</strong></div>`;

  document.getElementById('summaryCards').innerHTML = cards;
}

function renderGrouped() {
  const s = getScope();
  const filter = document.getElementById('charFilter').value;
  const list = filter ? s.by_character.filter(c => c.char_key === filter) : s.by_character;
  let html = '';
  for (const c of list) {
    const t = c.total;
    let rows = '';
    for (const a of c.arcanas) {
      rows += `<tr>
        <td><strong>${esc(a.combo_call)}</strong></td>
        <td>${esc(a.arcana_name)}</td>
        <td class="num">${a.matches}</td>
        <td class="num win">${a.wins}</td>
        <td class="num lose">${a.losses}</td>
        <td class="num">${rateBar(a.win_rate)}</td>
        <td class="num">${a.rounds_won} - ${a.rounds_lost}</td>
      </tr>`;
    }
    html += `<div class="char-card">
      <div class="char-header">
        <h3>${esc(c.char_name)} <small>${esc(c.char_full)}</small></h3>
        <div class="char-total">
          通算 <strong>${t.matches}試合</strong> /
          <span class="win">${t.wins}勝</span> <span class="lose">${t.losses}敗</span>
          （勝率 <strong>${t.win_rate.toFixed(1)}%</strong> / R ${t.rounds_won}-${t.rounds_lost}）
          <button style="margin-left:8px;padding:3px 9px;font-size:0.78rem" onclick="jumpToMatchup('${esc(c.char_key)}')">組み合わせ勝率を見る</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>通称</th><th>アルカナ</th><th class="num">試合</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th><th class="num">ラウンド</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }
  document.getElementById('tab-grouped').innerHTML = html || '<p class="muted">データがありません。</p>';
}

function jumpToMatchup(charKey) {
  selectedMuChar = charKey;
  selectedMuOwnArcana = '';
  matchupMode = 'list';
  showTab('matchups');
}

function renderMatchups() {
  const s = getScope();
  const chars = s.by_character;
  if (!chars.length) {
    document.getElementById('tab-matchups').innerHTML = '<p class="muted">データがありません。</p>';
    return;
  }
  if (!selectedMuChar || !chars.some(c => c.char_key === selectedMuChar)) {
    selectedMuChar = chars[0].char_key;
    selectedMuOwnArcana = '';
  }

  let html = `<div class="sub-controls">
    <button class="${matchupMode === 'list' ? 'active' : ''}" onclick="setMatchupMode('list')">キャラ別 対戦リスト（クリックでアルカナ展開）</button>
    <button class="${matchupMode === 'matrix' ? 'active' : ''}" onclick="setMatchupMode('matrix')">全体相性マトリクス（ヒートマップ）</button>
  </div>`;

  if (matchupMode === 'list') {
    html += renderMatchupList(s);
  } else {
    html += renderMatchupMatrix(s);
  }
  document.getElementById('tab-matchups').innerHTML = html;
}

function setMatchupMode(mode) {
  matchupMode = mode;
  renderMatchups();
}

function selectMuChar(ck) {
  selectedMuChar = ck;
  selectedMuOwnArcana = '';
  renderMatchups();
}

function selectMuOwnArcana(ak) {
  selectedMuOwnArcana = ak;
  renderMatchups();
}

function renderMatchupList(s) {
  const chars = s.by_character;
  const activeChar = chars.find(c => c.char_key === selectedMuChar) || chars[0];
  const ck = activeChar.char_key;

  let charOpts = '';
  for (const c of chars) {
    const sel = c.char_key === ck ? ' selected' : '';
    charOpts += `<option value="${esc(c.char_key)}"${sel}>${esc(c.char_name)}（${c.total.matches}試合）</option>`;
  }

  let arcOpts = `<option value=""${selectedMuOwnArcana === '' ? ' selected' : ''}>全アルカナ合計（${activeChar.total.matches}試合）</option>`;
  for (const a of activeChar.arcanas) {
    const sel = selectedMuOwnArcana === a.arcana_key ? ' selected' : '';
    arcOpts += `<option value="${esc(a.arcana_key)}"${sel}>${esc(a.combo_call)} / ${esc(a.arcana_name)}（${a.matches}試合）</option>`;
  }

  const filterBar = `<div class="sub-controls">
    <div class="scope-box">
      <label for="muCharSel">キャラ:</label>
      <select id="muCharSel" onchange="selectMuChar(this.value)">${charOpts}</select>
    </div>
    <div class="scope-box">
      <label for="muArcSel">使用アルカナ:</label>
      <select id="muArcSel" onchange="selectMuOwnArcana(this.value)">${arcOpts}</select>
    </div>
    <button style="margin-left:auto;font-size:0.8rem;padding:6px 10px" onclick="toggleAllMuDetails(true)">すべて展開</button>
    <button style="font-size:0.8rem;padding:6px 10px" onclick="toggleAllMuDetails(false)">すべて閉じる</button>
  </div>`;

  const muMap = s.matchups[ck] || {};
  const oppEntries = [];
  for (const ok of Object.keys(muMap)) {
    const raw = muMap[ok];
    let pairs = raw.arcana_pairs;
    if (selectedMuOwnArcana) {
      pairs = pairs.filter(p => p.my_arcana_key === selectedMuOwnArcana);
      if (!pairs.length) continue;
    }
    let wins = 0, losses = 0, draws = 0, rw = 0, rl = 0;
    for (const p of pairs) {
      wins += p.wins; losses += p.losses; draws += p.draws;
      rw += p.rounds_won; rl += p.rounds_lost;
    }
    const matches = wins + losses + draws;
    const decided = wins + losses;
    const win_rate = decided ? (wins / decided * 100.0) : 0.0;
    oppEntries.push({
      opp_char_key: ok,
      opp_char_name: raw.opp_char_name,
      is_mirror: raw.is_mirror && !selectedMuOwnArcana,
      real_matches: (raw.is_mirror && !selectedMuOwnArcana) ? Math.floor(matches / 2) : matches,
      matches, wins, losses, draws, rw, rl, win_rate, pairs,
    });
  }
  oppEntries.sort((a, b) => (b.real_matches - a.real_matches) || (b.win_rate - a.win_rate));

  let rows = '';
  oppEntries.forEach((o, idx) => {
    const id = `mu-det-${idx}`;
    const mirrorTag = o.is_mirror ? ' <span class="badge">同キャラ</span>' : '';
    const pairCountBadge = `<span class="badge">${o.pairs.length}組</span>`;
    let detailRows = '';
    for (const p of o.pairs) {
      detailRows += `<tr>
        <td><strong>${esc(p.my_call)}</strong> <span class="muted">(${esc(p.my_arcana_name)})</span></td>
        <td>vs <strong>${esc(p.opp_call)}</strong> <span class="muted">(${esc(p.opp_arcana_name)})</span></td>
        <td class="num">${p.matches}</td>
        <td class="num win">${p.wins}</td>
        <td class="num lose">${p.losses}</td>
        <td class="num">${rateBar(p.win_rate)}</td>
        <td class="num">${p.rounds_won} - ${p.rounds_lost}</td>
      </tr>`;
    }
    rows += `<tr class="mu-row" onclick="toggleMuRow(this, '${id}')">
      <td><span class="caret">▶</span> <strong>vs ${esc(o.opp_char_name)}</strong>${mirrorTag}</td>
      <td class="num">${o.real_matches}</td>
      <td class="num win">${o.wins}</td>
      <td class="num lose">${o.losses}</td>
      <td class="num">${o.is_mirror ? '<span class="muted">50.0%（同キャラ）</span>' : rateBar(o.win_rate)}</td>
      <td class="num">${o.rw} - ${o.rl}</td>
      <td class="num">${pairCountBadge}</td>
    </tr>
    <tr id="${id}" class="mu-detail"><td colspan="7">
      <div class="detail-inner">
        <div class="detail-title">${esc(activeChar.char_name)} vs ${esc(o.opp_char_name)} — 使用アルカナ別内訳</div>
        <div class="table-wrap"><table>
          <thead><tr><th>自分（アルカナ）</th><th>相手（アルカナ）</th><th class="num">試合</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th><th class="num">ラウンド</th></tr></thead>
          <tbody>${detailRows}</tbody>
        </table></div>
      </div>
    </td></tr>`;
  });

  const headingSub = selectedMuOwnArcana
    ? `${activeChar.arcanas.find(a => a.arcana_key === selectedMuOwnArcana)?.combo_call || ''}`
    : `${activeChar.char_name}（全アルカナ）`;

  return `${filterBar}
    <p class="hint">※ 各対戦行をクリックすると「使用アルカナ × 相手アルカナ」別の詳細内訳が展開されます。</p>
    <div class="char-card">
      <div class="char-header">
        <h3>${esc(headingSub)} の組み合わせ勝率</h3>
        <div class="char-total">対戦相手 ${oppEntries.length}キャラ</div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>相手キャラ</th><th class="num">試合</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th><th class="num">ラウンド</th><th class="num">アルカナ内訳</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="muted">対戦データがありません。</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

function toggleMuRow(tr, detailId) {
  const det = document.getElementById(detailId);
  if (!det) return;
  const open = !det.classList.contains('open');
  det.classList.toggle('open', open);
  tr.classList.toggle('open', open);
}

function toggleAllMuDetails(open) {
  document.querySelectorAll('#tab-matchups tr.mu-detail').forEach(tr => tr.classList.toggle('open', open));
  document.querySelectorAll('#tab-matchups tr.mu-row').forEach(tr => tr.classList.toggle('open', open));
}

function heatColor(rate, isMirror) {
  if (isMirror) return 'rgba(148, 163, 184, 0.14)';
  if (rate >= 70) return 'rgba(34, 197, 94, 0.38)';
  if (rate >= 55) return 'rgba(34, 197, 94, 0.20)';
  if (rate > 45) return 'rgba(56, 189, 248, 0.16)';
  if (rate > 30) return 'rgba(248, 113, 113, 0.22)';
  return 'rgba(239, 68, 68, 0.40)';
}

function renderMatchupMatrix(s) {
  const chars = s.by_character;
  let head = '<tr><th class="sticky">自分 ／ 相手</th>';
  for (const c of chars) {
    head += `<th>${esc(c.char_name)}</th>`;
  }
  head += '</tr>';

  let body = '';
  for (const rowC of chars) {
    const ck = rowC.char_key;
    const rowMap = s.matchups[ck] || {};
    body += `<tr><td class="sticky">${esc(rowC.char_name)}</td>`;
    for (const colC of chars) {
      const ok = colC.char_key;
      const mu = rowMap[ok];
      const isSel = selectedMatrixPair && selectedMatrixPair[0] === ck && selectedMatrixPair[1] === ok;
      if (!mu) {
        body += '<td class="muted">-</td>';
      } else if (mu.is_mirror) {
        body += `<td class="cell-click ${isSel ? 'cell-selected' : ''}" style="background:${heatColor(50, true)}" onclick="selectMatrixCell('${esc(ck)}','${esc(ok)}')">
          <span class="cell-rate muted">同キャラ</span><span class="cell-wl">${mu.real_matches}戦</span>
        </td>`;
      } else {
        body += `<td class="cell-click ${isSel ? 'cell-selected' : ''}" style="background:${heatColor(mu.win_rate, false)}" onclick="selectMatrixCell('${esc(ck)}','${esc(ok)}')">
          <span class="cell-rate">${mu.win_rate.toFixed(0)}%</span><span class="cell-wl">${mu.wins}-${mu.losses}</span>
        </td>`;
      }
    }
    body += '</tr>';
  }

  let detailHtml = '';
  if (selectedMatrixPair) {
    const [aKey, bKey] = selectedMatrixPair;
    const mu = (s.matchups[aKey] || {})[bKey];
    const aObj = chars.find(c => c.char_key === aKey);
    const bObj = chars.find(c => c.char_key === bKey);
    if (mu && aObj && bObj) {
      let pRows = '';
      for (const p of mu.arcana_pairs) {
        pRows += `<tr>
          <td><strong>${esc(p.my_call)}</strong> <span class="muted">(${esc(p.my_arcana_name)})</span></td>
          <td>vs <strong>${esc(p.opp_call)}</strong> <span class="muted">(${esc(p.opp_arcana_name)})</span></td>
          <td class="num">${p.matches}</td>
          <td class="num win">${p.wins}</td>
          <td class="num lose">${p.losses}</td>
          <td class="num">${rateBar(p.win_rate)}</td>
          <td class="num">${p.rounds_won} - ${p.rounds_lost}</td>
        </tr>`;
      }
      detailHtml = `<div class="matrix-detail-box">
        <div class="matrix-detail-head">
          <div><strong>${esc(aObj.char_name)} vs ${esc(bObj.char_name)}</strong>（計 ${mu.real_matches}試合 / ${mu.is_mirror ? '同キャラ戦' : `${mu.wins}勝 ${mu.losses}敗・勝率 ${mu.win_rate.toFixed(1)}%`}）</div>
          <button style="padding:3px 10px;font-size:0.8rem" onclick="selectedMatrixPair=null;renderMatchups()">閉じる</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>自分（アルカナ）</th><th>相手（アルカナ）</th><th class="num">試合</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th><th class="num">ラウンド</th></tr></thead>
          <tbody>${pRows}</tbody>
        </table></div>
      </div>`;
    }
  }

  return `<p class="hint">※ 行が自分側・列が相手側の勝率です。気になるマスをクリックすると下に「使用アルカナ別内訳」が表示されます。</p>
    <div class="matrix-wrap"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    ${detailHtml}`;
}

function selectMatrixCell(aKey, bKey) {
  selectedMatrixPair = [aKey, bKey];
  renderMatchups();
}

function renderArcana() {
  const s = getScope();
  const rows = s.by_arcana.map(r => `<tr>
    <td><strong>${esc(r.arcana_name)}</strong></td>
    <td>${esc(r.arcana_full)}</td>
    <td class="num">${r.matches}</td>
    <td class="num win">${r.wins}</td>
    <td class="num lose">${r.losses}</td>
    <td class="num">${rateBar(r.win_rate)}</td>
    <td class="num">${r.rounds_won} - ${r.rounds_lost}</td>
  </tr>`).join('');
  document.getElementById('tab-arcana').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>アルカナ</th><th>正式名称</th><th class="num">試合</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th><th class="num">ラウンド</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderC7() {}

function renderVideos() {
  const s = getScope();
  const hasLocal = APP.include_c7;
  const rows = s.videos.map(v => `<tr>
    <td>${esc(v.date)}</td>
    <td><a href="${esc(v.webpage_url)}" target="_blank" rel="noopener">${esc(v.title)}</a></td>
    <td class="num">${v.matches}試合</td>
    ${hasLocal ? `<td><a href="${esc(v.local_report)}">勝敗表HTML</a></td>` : ''}
  </tr>`).join('');
  document.getElementById('tab-videos').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>開催日</th><th>動画タイトル</th><th class="num">試合数</th>${hasLocal ? '<th>個別レポート</th>' : ''}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderCurrentTab() {
  const filterEl = document.getElementById('charFilter');
  filterEl.style.display = currentTab === 'grouped' ? '' : 'none';
  if (currentTab === 'grouped') renderGrouped();
  else if (currentTab === 'matchups') renderMatchups();
  else if (currentTab === 'arcana') renderArcana();
  else if (currentTab === 'c7') renderC7();
  else if (currentTab === 'videos') renderVideos();
}

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('tab-' + name).classList.add('active');
  renderCurrentTab();
}

initCalendarMonth();
updateScopeTrigger();
updateCharFilterOptions();
renderSummaryCards();
renderCurrentTab();
</script>
</body>
</html>
